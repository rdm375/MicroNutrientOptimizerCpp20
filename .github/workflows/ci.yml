name: build-and-regression

on:
  push:
  pull_request:

jobs:
  ubuntu-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build
      - name: Install pinned Python dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Build pinned OSQP
        run: |
          git clone --depth 1 --branch v1.0.0 https://github.com/osqp/osqp.git "$RUNNER_TEMP/osqp"
          cmake -S "$RUNNER_TEMP/osqp" -B "$RUNNER_TEMP/osqp-build" \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/osqp-install"
          cmake --build "$RUNNER_TEMP/osqp-build" --parallel
          cmake --build "$RUNNER_TEMP/osqp-build" --target install
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -Dosqp_ROOT="$RUNNER_TEMP/osqp-install"
      - name: Build
        run: cmake --build build --parallel
      - name: Regression checks
        run: ctest --test-dir build --output-on-failure
